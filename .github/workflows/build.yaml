name: Build

on:
  push:
    tags: ['v*']

# Default-deny: each job must declare the permissions it needs.
permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      release_version: ${{ github.ref_name }} # the pushed tag, e.g. v0.18.0-1.4.6.1

      folders: ",\\UI,\\UI\\Workshop,\\UI\\WorldGen,\\UI\\PlayerResourceSets,\\UI\\PlayerResourceSets\\HorizontalBars,\\UI\\PlayerResourceSets\\FancyClassic,\\UI\\CharCreation,\\UI\\WorldCreation,\\UI\\Minimap,\\UI\\Minimap\\Leaf,\\UI\\Minimap\\StoneGold,\\UI\\Minimap\\Golden,\\UI\\Minimap\\Default,\\UI\\Minimap\\Valkyrie,\\UI\\Minimap\\TwigLeaf,\\UI\\Minimap\\Sticks,\\UI\\Minimap\\Retro,\\UI\\Minimap\\Remix,\\UI\\Bestiary,\\UI\\Bestiary\\NPCs,\\UI\\Creative,\\Accessories,\\TownNPCs,\\TownNPCs\\Portraits,\\TownNPCs\\Shimmered,\\Armor,\\UI\\MultiplayerLobby"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.10' # Version range or exact version of a Python version to use, using SemVer's version range syntax
          architecture: 'x64' # optional x64 or x86. Defaults to x64 if not specified
      - name: dir
        run: dir
      - name: count-files
        run: (Get-ChildItem source-pngs -Recurse -File | Measure-Object).Count

      - name: downscale-pngs
        run: |
          $folders = ${Env:folders} -split ','
          foreach( $folder in $folders ) {
            echo "folder: $folder"
            (New-Item ${Env:output}$folder -ItemType directory)
            tools\downscale_pngs.exe ${Env:input}$folder ${Env:output}$folder
            if ($lastexitcode -ne 0) {
              throw ("Exec: " + $errorMessage)
            }
          }
        env:
          input: 'source-pngs'
          output: 'temp2'
      - name: count-files
        run: (Get-ChildItem temp2 -Recurse -File | Measure-Object).Count

      - name: remove separators
        run: |
          $folders = ${Env:folders} -split ','
          foreach( $folder in $folders ) {
            echo "folder: $folder"
            (New-Item ${Env:output}$folder -ItemType directory)
            python tools\remove_separators.py ${Env:input}$folder ${Env:output}$folder
            if ($lastexitcode -ne 0) {
              throw ("Exec: " + $errorMessage)
            }
          }
        env:
          input: 'temp2'
          output: 'temp3'
      - name: count-files
        run: (Get-ChildItem temp3 -Recurse -File | Measure-Object).Count

      - name: magnify-pngs
        run: |
          (New-Item ${Env:input}\Items -ItemType directory)
          (Move-Item ${Env:input}\Item_* -Destination ${Env:input}\Items)
          $folders = ${Env:folders} -split ','
          foreach( $folder in $folders ) {
            echo "folder: $folder"
            (New-Item ${Env:output}$folder -ItemType directory)
            tools\image_filter.exe "XBRz" ${Env:input}$folder ${Env:output}$folder
            if ($lastexitcode -ne 0) {
              throw ("Exec: " + $errorMessage)
            }
          }
          tools\image_filter.exe "XBRz" -wrap ${Env:input}\Items ${Env:output}
          if ($lastexitcode -ne 0) {
            throw ("Exec: " + $errorMessage)
          }
        env:
          input: 'temp3'
          output: 'temp4'
      - name: count-files
        run: (Get-ChildItem temp4 -Recurse -File | Measure-Object).Count

      - name: refill-missing-pixels
        run: |
          $folders = ${Env:folders} -split ','
          foreach( $folder in $folders ) {
            echo "folder: $folder"
            (New-Item ${Env:output}$folder -ItemType directory)
            tools\refill_missing_pixels.exe ${Env:original_folder}$folder ${Env:input}$folder ${Env:output}$folder
            if ($lastexitcode -ne 0) {
              throw ("Exec: " + $errorMessage)
            }
          }
        env:
          original_folder: 'source-pngs'
          input: 'temp4'
          output: 'temp5'
      - name: count-files
        run: (Get-ChildItem temp5 -Recurse -File | Measure-Object).Count

      - name: png-to-xnb
        run: |
          $folders = ${Env:folders} -split ','
          foreach( $folder in $folders ) {
            echo "folder: $folder"
            (New-Item ${Env:output}$folder -ItemType directory)
            tools\png_to_xnb.exe ${Env:input}$folder ${Env:output}$folder
            if ($lastexitcode -ne 0) {
              throw ("Exec: " + $errorMessage)
            }
          }
        env:
          input: 'temp5'
          output: 'Images' # this has to be Images because we use this folder name specifically in the release zip file
      - name: count-files
        run: (Get-ChildItem Images -Recurse -File | Measure-Object).Count

      - name: create-zip-release
        run: |
          # The tag looks like <pack version>-<terraria version>, e.g. v0.18.0-1.4.6.1
          $pack_version, $terraria_version = ${Env:release_version}.Split('-', 2)
          if (-not $terraria_version) {
            throw "Tag '${Env:release_version}' must look like v0.18.0-1.4.6.1"
          }
          $today = Get-Date -Format "yyyy-MM-dd"
          "Enhanced version of the textures of Terraria $terraria_version" > README.txt
          "" >> README.txt
          "Created by Andras Suller, $today, $pack_version." >> README.txt
          "For more information visit: https://forums.terraria.org/index.php?threads/high-definition-version-of-all-textures-up-to-terraria-1-4-5-8.39115/" >> README.txt

          rmdir -r Images\Backgrounds -ErrorAction:SilentlyContinue
          rmdir -r Images\Misc -ErrorAction:SilentlyContinue
          rmdir -r Images\UI\WorldGen -ErrorAction:SilentlyContinue
          rmdir Images\UI\Button* -ErrorAction:SilentlyContinue

          .\zip.exe -r Images-${Env:release_version}.zip README.txt Images

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: Images-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  # Only this job gets write access, and it runs no third-party code
  # besides download-artifact.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-zip

      - name: publish-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "Images-$TAG.zip" \
            --title "$TAG" \
            --generate-notes \
            --prerelease \
            --draft
